<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#f39200"
    />

    <!-- Description -->
    <meta
      name="description"
      content="SahajoMart connects customers with nearby stores for simple category-wise shopping, offers and store access."
    />

    <!-- ========================================
         SAHAJO MART LOGO / FAVICON
    ========================================= -->

    <!-- Browser Favicon -->
    <link
      rel="icon"
      href="https://i.postimg.cc/c4y0j5vN/img-2-1784471233954-jpg.jpg"
    />

    <!-- Apple / iPhone Icon -->
    <link
      rel="apple-touch-icon"
      href="https://i.postimg.cc/c4y0j5vN/img-2-1784471233954-jpg.jpg"
    />

    <!-- PWA Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- ========================================
         MOBILE / PWA SETTINGS
    ========================================= -->

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="SahajoMart"
    />

    <!-- ========================================
         TITLE
    ========================================= -->

    <title>
      Sahjo Mart - Nearby Shopping Made Simple
    </title>

    <!-- ========================================
         OUTFIT FONT
    ========================================= -->

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
  href="https://fonts.googleapis.com/css2?family=Pacifico&family=Source+Sans+Pro:wght@400;600;700&display=swap"
  rel="stylesheet"
/>

  </head>

  <body>

    <noscript>
      You need to enable JavaScript to run SahajoMart.
    </noscript>

    <div id="root"></div>

  </body>
</html>
