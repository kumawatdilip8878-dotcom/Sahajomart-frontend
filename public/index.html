
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- ========================================
         THEME COLOR
    ========================================= -->

    <meta
      name="theme-color"
      content="#f39200"
    />

    <!-- ========================================
         DESCRIPTION
    ========================================= -->

    <meta
      name="description"
      content="Sahjo Mart connects customers with nearby stores for simple category-wise shopping, offers and store access."
    />

    <!-- ========================================
         SAHJO MART LOGO / FAVICON
    ========================================= -->

    <!-- Browser Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/icons/sahjo-192.png?v=20"
    />

    <!-- Apple / iPhone Home Screen Icon -->
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="%PUBLIC_URL%/icons/sahjo-192.png?v=20"
    />

    <!-- ========================================
         PWA MANIFEST
    ========================================= -->

    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json?v=20"
    />

    <!-- ========================================
         MOBILE / PWA SETTINGS
    ========================================= -->

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Sahjo Mart"
    />

    <!-- ========================================
         TITLE
    ========================================= -->

    <title>
      Sahjo Mart - Nearby Shopping Made Simple
    </title>

    <!-- ========================================
         FONTS
    ========================================= -->

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Source+Sans+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>

    <noscript>
      You need to enable JavaScript to run Sahjo Mart.
    </noscript>

    <div id="root"></div>

  </body>
</html>
